name: SABLE Launcher Intel Mac diagnostics

on:
  push:
    branches:
      - qa/sable-launcher-mac-1.0.0

permissions: {}

jobs:
  mac-launcher:
    name: Intel Mac launcher, WebGL, and canvas
    runs-on: macos-15-intel
    timeout-minutes: 8

    steps:
      - name: Play the published build with the default GPU
        shell: bash
        env:
          RELEASE_ZIP: SABLE-Launcher-Mac-Intel.zip
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          node -e 'if (typeof WebSocket !== "function") throw Error("Node 22+ with built-in WebSocket is required")'
          work="$(mktemp -d "$RUNNER_TEMP/sable-mac.XXXXXXXX")"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            --retry-max-time 140 --connect-timeout 15 --max-time 90 \
            --output "$work/launcher.zip" \
            "https://github.com/playsable/playsable.github.io/releases/download/launcher-v1.0.0/$RELEASE_ZIP"
          /usr/bin/ditto -x -k "$work/launcher.zip" "$work"
          bundle="$work/SABLE Launcher.app"
          /usr/bin/plutil -lint "$bundle/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/Sable"
          test -x "$bundle/Contents/Runtime/Electron.app/Contents/MacOS/Electron"
          export SABLE_MAC_WORK="$work"
          cat > "$work/smoke.mjs" <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createServer } from "node:net";
          import path from "node:path";
          import { setTimeout as delay } from "node:timers/promises";

          const [bundle, mode] = process.argv.slice(2);
          const software = mode === "swiftshader";
          console.log("Graphics mode:", mode);
          const graphicsFlags = software
            ? ["--use-gl=angle", "--use-angle=swiftshader-webgl", "--enable-unsafe-swiftshader"]
            : [];
          const port = await new Promise((resolve, reject) => {
            const socket = createServer();
            socket.once("error", reject);
            socket.listen(0, "127.0.0.1", () => {
              const { port } = socket.address();
              socket.close(error => (error ? reject(error) : resolve(port)));
            });
          });
          const endpoint = "http://127.0.0.1:" + port;
          const profile = path.join(process.env.SABLE_MAC_WORK, "profile-" + mode);

          execFileSync("/usr/bin/open", [
            "-na", bundle, "--args",
            "--remote-debugging-address=127.0.0.1",
            "--remote-debugging-port=" + port,
            "--user-data-dir=" + profile,
            ...graphicsFlags
          ], { stdio: "inherit", timeout: 15000 });

          async function until(description, timeout, predicate) {
            const deadline = Date.now() + timeout;
            let lastError;
            while (Date.now() < deadline) {
              try {
                const result = await predicate();
                if (result) return result;
              } catch (error) {
                lastError = error;
              }
              await delay(500);
            }
            throw new Error(description, { cause: lastError });
          }

          async function pages() {
            const response = await fetch(endpoint + "/json/list", { signal: AbortSignal.timeout(3000) });
            if (!response.ok) throw new Error("Chromium target discovery returned HTTP " + response.status);
            return (await response.json()).filter(target => target.type === "page");
          }

          async function connect(target, onEvent = () => {}) {
            const address = new URL(target.webSocketDebuggerUrl);
            assert.equal(address.protocol, "ws:");
            assert.match(address.hostname, /^(127\.0\.0\.1|localhost)$/);
            assert.equal(address.port, String(port));
            const socket = new WebSocket(address);
            const pending = new Map();
            let nextId = 0;
            socket.addEventListener("message", ({ data }) => {
              const message = JSON.parse(data);
              const request = pending.get(message.id);
              if (!request) { onEvent(message); return; }
              pending.delete(message.id);
              clearTimeout(request.timer);
              if (message.error) request.reject(new Error(message.error.message));
              else request.resolve(message.result);
            });
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                socket.close();
                reject(new Error("Chromium debugging socket did not open"));
              }, 7000);
              socket.addEventListener("open", () => { clearTimeout(timer); resolve(); }, { once: true });
              socket.addEventListener("error", () => {
                clearTimeout(timer);
                reject(new Error("Chromium debugging socket failed"));
              }, { once: true });
            });
            return {
              call(method, params = {}) {
                const id = ++nextId;
                return new Promise((resolve, reject) => {
                  const timer = setTimeout(() => {
                    pending.delete(id);
                    reject(new Error("Chromium timed out on " + method));
                  }, 7000);
                  pending.set(id, { resolve, reject, timer });
                  socket.send(JSON.stringify({ id, method, params }));
                });
              },
              close() { socket.close(); }
            };
          }

          async function evaluate(target, expression) {
            const reply = await target.call("Runtime.evaluate", { expression, returnByValue: true });
            if (reply.exceptionDetails) throw new Error(reply.exceptionDetails.text);
            return reply.result.value;
          }

          function isOfficialGame(value) {
            const url = new URL(value);
            return url.origin === "https://playsable.github.io" &&
              ["/play/", "/play/index.html"].includes(url.pathname);
          }

          function gameState() {
            const el = document.querySelector("#canvas");
            const status = document.querySelector("#status");
            const notice = document.querySelector("#status-notice");
            const progress = document.querySelector("#status-progress");
            return {
              title: document.title,
              readyState: document.readyState,
              hidden: document.hidden,
              crossOriginIsolated: window.crossOriginIsolated,
              sharedArrayBuffer: typeof SharedArrayBuffer,
              canvas: el ? { width: el.width, height: el.height, visible: el.getBoundingClientRect().height > 0 } : null,
              status: status ? {
                className: status.className, display: getComputedStyle(status).display,
                visibility: getComputedStyle(status).visibility,
                notice: notice?.textContent.trim(),
                progress: progress && { value: progress.value, max: progress.max }
              } : null,
              resources: performance.getEntriesByType("resource")
                .filter(entry => /\.(?:wasm|pck|js)$/.test(new URL(entry.name).pathname))
                .map(entry => ({ path: new URL(entry.name).pathname,
                  status: entry.responseStatus, bytes: entry.encodedBodySize, ms: Math.round(entry.duration) })),
              node: typeof require
            };
          }

          function separateWebGLProbe() {
            const test = document.createElement("canvas");
            const gl = test.getContext("webgl2");
            if (!gl) return { webgl2: false };
            const debug = gl.getExtension("WEBGL_debug_renderer_info");
            return {
              webgl2: true,
              version: gl.getParameter(gl.VERSION),
              vendor: debug && gl.getParameter(debug.UNMASKED_VENDOR_WEBGL),
              renderer: debug && gl.getParameter(debug.UNMASKED_RENDERER_WEBGL),
              contextLost: gl.isContextLost()
            };
          }

          async function gpuReport() {
            let browser;
            try {
              const version = await fetch(endpoint + "/json/version", { signal: AbortSignal.timeout(3000) });
              browser = await connect(await version.json());
              const { gpu } = await browser.call("SystemInfo.getInfo");
              return { devices: gpu.devices, featureStatus: gpu.featureStatus,
                glRenderer: gpu.auxAttributes?.glRenderer, glVersion: gpu.auxAttributes?.glVersion };
            } catch (error) {
              return { unavailable: error.message };
            } finally {
              browser?.close();
            }
          }

          const launcherPage = await until("LaunchServices did not open the launcher window", 40000, async () =>
            (await pages()).find(target => {
              const url = new URL(target.url);
              return url.protocol === "file:" && url.pathname.endsWith("/Contents/Resources/SableApp/index.html");
            }));
          const launcher = await connect(launcherPage);
          let game;
          let latest;
          let latestGame = null;
          const errors = [];
          function onGameEvent(event) {
            const info = event.params;
            const message = event.method === "Runtime.exceptionThrown"
              ? info.exceptionDetails.exception?.description || info.exceptionDetails.text
              : event.method === "Log.entryAdded" && ["warning", "error"].includes(info.entry.level)
                ? info.entry.text
                : null;
            if (message && errors.length < 20) errors.push(String(message).slice(0, 700));
          }
          try {
            const launcherState = await until("Visible launcher never offered Play SABLE", 35000, async () => {
              latest = await evaluate(launcher, '(() => { const button = document.querySelector("#play"); if (!button) return null; const rect = button.getBoundingClientRect(); return { label: button.firstElementChild.textContent.trim(), ready: !button.disabled, visible: !document.hidden && rect.width > 0 && rect.height > 0, sha: document.querySelector("#version").textContent.trim(), notice: document.querySelector("#notice").textContent.trim(), x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 }; })()');
              return latest?.ready && latest.visible && latest;
            });
            assert.equal(launcherState.label, "Play SABLE");
            assert.match(launcherState.sha, /^[a-f0-9]{7,40}$/);
            const { x, y } = launcherState;
            await launcher.call("Input.dispatchMouseEvent", { type: "mousePressed", x, y, button: "left", buttons: 1, clickCount: 1 });
            await launcher.call("Input.dispatchMouseEvent", { type: "mouseReleased", x, y, button: "left", clickCount: 1 });

            const gamePage = await until("Play SABLE did not open the official game", 42000, async () => {
              latest = await evaluate(launcher, '({ sha: document.querySelector("#version").textContent.trim(), notice: document.querySelector("#notice").textContent.trim() })');
              return (await pages()).find(target => isOfficialGame(target.url));
            });
            const gameUrl = new URL(gamePage.url);
            assert.equal(gameUrl.searchParams.get("v"), latest.sha);
            game = await connect(gamePage, onGameEvent);
            await game.call("Runtime.enable");
            await game.call("Log.enable");
            const observed = await until("Godot did not show the game canvas", software ? 95000 : 40000, async () => {
              latestGame = await evaluate(game, "(" + gameState.toString() + ")()");
              const { canvas, status, hidden } = latestGame;
              if (status?.className.split(" ").includes("notice") && status.notice) {
                return { gameError: status.notice };
              }
              if (!status && !hidden && canvas?.visible && canvas.width > 0 && canvas.height > 0) return latestGame;
              return null;
            });
            if (observed.gameError) throw new Error("Godot loading stopped: " + observed.gameError);
            const canvas = { ...observed, ...observed.canvas };
            assert.match(canvas.title, /^SABLE(?:$|\s*\|)/);
            assert.equal(canvas.node, "undefined");
            const screenshot = await game.call("Page.captureScreenshot", { format: "png", fromSurface: true });
            const png = Buffer.from(screenshot.data, "base64");
            assert.equal(png.toString("ascii", 1, 4), "PNG");
            assert.ok(png.readUInt32BE(16) > 0 && png.readUInt32BE(20) > 0);
            console.log("LaunchServices opened SABLE Launcher, Play SABLE opened " + gameUrl.origin + gameUrl.pathname + " build " + latest.sha);
            console.log("Godot canvas rendered at " + canvas.width + " x " + canvas.height);
            console.log("Game document hidden:", latestGame.hidden);
          } catch (error) {
            console.error("Last launcher state:", JSON.stringify(latest));
            console.error("Last game state:", JSON.stringify(latestGame));
            console.error("Game document hidden:", latestGame?.hidden ?? "unknown");
            console.error("Godot status notice:", latestGame?.status?.notice || "(none)");
            console.error("Game browser warnings:", JSON.stringify(errors));
            if (game) {
              try {
                console.error("Independent WebGL2 probe:", JSON.stringify(await evaluate(game, "(" + separateWebGLProbe.toString() + ")()")));
              } catch (probeError) {
                console.error("Independent WebGL2 probe unavailable:", probeError.message);
              }
            }
            console.error("Chromium GPU features:", JSON.stringify(await gpuReport()));
            throw error;
          } finally {
            game?.close();
            launcher.close();
          }
          NODE
          if node "$work/smoke.mjs" "$bundle" default; then
            echo "Intel Mac rendered SABLE with the published launcher's default graphics."
          else
            echo "::warning::Default graphics failed. Retrying in an isolated profile with test-only SwiftShader."
            if node "$work/smoke.mjs" "$bundle" swiftshader; then
              echo "::error::Intel Mac rendered SABLE only with test-only SwiftShader enabled."
            else
              echo "::error::Intel Mac failed to render SABLE with both default graphics and test-only SwiftShader."
            fi
            exit 1
          fi
