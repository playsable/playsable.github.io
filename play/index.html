@font-face {
	font-family: 'SeybleTitle';
	src: url('index.e24c56d26f38.title.ttf') format('truetype');
	font-display: swap;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e5dfce;
	background-color: #0b0f10;
	overflow: hidden;
	overscroll-behavior: none;
}

#canvas {
	touch-action: none;
	display: block;
	width: 100%;
	height: 100%;
	position: absolute;
	inset: 0;
}

#canvas:focus {
	outline: none;
}

#seyble-fullscreen {
	position: fixed;
	z-index: 2;
	top: max(4px, env(safe-area-inset-top));
	left: 45%;
	transform: translateX(-50%);
	min-height: 44px;
	padding: 0 .8rem;
	border: 1px solid #8b7758;
	border-radius: 4px;
	background: #172025;
	color: #eee3cd;
	font: 15px/1.25 Georgia, serif;
	touch-action: manipulation;
}
#seyble-fullscreen[hidden], body:has(dialog[open]) #seyble-fullscreen { display: none; }
#seyble-fullscreen-help {
	box-sizing: border-box;
	width: min(24rem, calc(100% - 2rem));
	border: 1px solid #99835d;
	background: #141d22;
	color: #eee3cd;
	font: 16px/1.45 Georgia, serif;
}
#seyble-fullscreen-help::backdrop { background: #080c0fbb; }
#seyble-fullscreen-help h2, #seyble-fullscreen-help p { margin: 0 0 .65rem; }
#seyble-fullscreen-help button { min-height: 44px; padding: 0 .8rem; font: inherit; background: #233038; color: inherit; border: 1px solid #8b7758; }
@media (pointer: coarse) {
	#canvas {
		left: env(safe-area-inset-left, 0px);
		top: env(safe-area-inset-top, 0px);
		width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
		height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
		height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
	}
}
#seyble-mobile-account {
	color-scheme: dark;
	box-sizing: border-box;
	position: fixed;
	inset: auto 0;
	top: var(--account-center, 50%);
	transform: translateY(-50%);
	width: min(27rem, calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 1.5rem));
	max-height: calc(100% - 1rem);
	max-height: calc(var(--account-height, 100dvh) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 1rem);
	margin: 0 auto;
	padding: clamp(1rem, 4vw, 1.65rem);
	border: 1px solid #99835d;
	background: #141d22;
	color: #e5dfce;
	font: 16px/1.45 Georgia, serif;
	overflow: auto;
	overscroll-behavior: contain;
	touch-action: pan-y;
}
#seyble-mobile-account::backdrop { background: rgba(8,12,15,.88); }
#seyble-mobile-account [hidden] { display: none; }
#seyble-mobile-account h1 { margin: 0; color: #f1dfb3; font: 600 1.65rem/1.1 SeybleTitle, Georgia, serif; }
#seyble-mobile-account p { margin: .65rem 0 .9rem; }
#seyble-mobile-account label { display: block; margin: .6rem 0; }
#seyble-mobile-account input, #seyble-mobile-account button {
	box-sizing: border-box; width: 100%; min-height: 44px; border: 1px solid #73664e;
	padding: .45rem .7rem; border-radius: 3px; font: inherit; color: inherit;
}
#seyble-mobile-account input { display: block; margin-top: .2rem; background: #0e151b; }
#seyble-mobile-account button { margin: .2rem 0; background: #233038; cursor: pointer; }
#seyble-mobile-account button[type=submit] { background: #d7bc83; color: #1e211f; font-weight: 700; }

#seyble-mobile-account :focus-visible { outline: 2px solid #e5c887; outline-offset: 1px; }

#status {
	position: absolute;
	inset: 0;
	background-color: #0b0f10;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	overflow: hidden;
	font-family: 'Alegreya', Georgia, 'Palatino Linotype', 'Noto Serif', serif;
}

#status {
	--wordmark-width: min(47vw, 116vh, 680px);
	--logo-x: 30%;
	--logo-y: 43%;
	color: #f6e9cb;
	background: #101d24;
}
#seyble-backdrop, .arrival-vista, #sable-stars {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}
#seyble-backdrop { overflow: hidden; z-index: 0; pointer-events: none; background-size: cover; background-position: 64% 50%; }
.arrival-vista {
	object-fit: cover;
	object-position: 64% 50%;
	opacity: 0;
	transition: opacity .9s ease-in-out;
}
#sable-stars {
	z-index: 1;
	pointer-events: none;
	background: linear-gradient(0deg,rgba(12,23,33,.35),transparent 65%),
		linear-gradient(90deg,rgba(12,23,33,.52),rgba(12,23,33,.04));
}
#arrival-wordmark {
	z-index: 2;
	position: absolute;
	left: var(--logo-x);
	top: var(--logo-y);
	transform: translate(-50%, -50%);
	width: var(--wordmark-width);
	aspect-ratio: 3 / 1;
	background: var(--wordmark-preview) center / contain no-repeat;
}
#sable-title {
	display: block;
	width: 100%;
	height: 100%;
	opacity: 0;
}
#arrival-wordmark.ready { background-image: none; }
#arrival-wordmark.ready #sable-title { opacity: 1; }
#arrival-progress {
	z-index: 2;
	position: absolute;
	left: var(--logo-x);
	top: calc(var(--logo-y) + var(--wordmark-width) / 6 + 11px);
	transform: translateX(-50%);
	width: clamp(164px, 21vw, 264px);
	text-align: center;
}
#sable-bar {
	position: relative;
	height: 4px;
	padding: 2px;
	border: 1px solid #97815d;
	background: rgba(14,26,33,.9);
	box-shadow: 0 2px 5px #10151a;
	overflow: hidden;
}
#sable-fill {
	position: absolute;
	inset: 2px auto 2px 0;
	width: 0;
	background: linear-gradient(90deg, #997649, #f4d99b);
	transition: width .22s ease;
}
#sable-bar.indeterminate #sable-fill { width: 30%; animation: sable-sweep 1.4s ease-in-out infinite; }
#sable-pct {
	margin-top: 9px;
	font: 500 clamp(13px,1.4vw,17px)/1.35 Georgia,serif;
	font-variant-numeric: tabular-nums;
	letter-spacing: .08em;
	color: #ffedc7;
	text-shadow: 0 1px 3px #101820;
}
#arrival-location {
	z-index: 2;
	position: absolute;
	right: max(4%,env(safe-area-inset-right));
	bottom: max(7.3%,env(safe-area-inset-bottom));
	margin: 0;
	padding-bottom: 6px;
	font: clamp(16px,2vw,28px)/1.3 Georgia,serif;
	text-shadow: 0 1px 3px #101820;
}
#arrival-location::after {
	content: "";
	position: absolute;
	right: 0;
	bottom: 0;
	width: 50px;
	border-bottom: 1px solid #c6a776;
}
#status.notice #arrival-progress { display: none; }
@media (orientation: portrait) {
	#status { --logo-x: 50%; --logo-y: 41%; --wordmark-width: min(88vw,680px); }
	#arrival-progress { width: min(52vw,264px); }
}
@media (prefers-reduced-motion: reduce) {
	.arrival-vista, #sable-fill { transition: none; }
	#sable-bar.indeterminate #sable-fill { animation: none; left: 35%; }
}
